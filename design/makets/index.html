<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121214">
<title>Календарь — Дивидендный календарь</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<header class="appbar">
  <div class="appbar__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">◇</span>
      <span class="brand__text">Дивидендный календарь</span>
    </div>

    <nav class="tabs" aria-label="Основная навигация">
      <a class="tab" href="#/calendar" data-nav="calendar">Календарь</a>
      <a class="tab" href="#/me" data-nav="watchlist">
        Мои сторожки
        <span class="badge js-badge" aria-hidden="true">3</span>
      </a>
    </nav>

    <div class="appbar__actions">
      <button class="icon-btn" id="refreshBtn" type="button" data-action="refresh"
              aria-label="Обновить данные" title="Обновить данные">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <section class="view page" id="view-calendar" aria-labelledby="calTitle">
    <h1 class="visually-hidden" id="calTitle">Календарь собраний</h1>

    <div class="toolbar">
      <div class="monthswitch" role="group" aria-label="Выбор месяца">
        <button class="icon-btn icon-btn--sm" type="button" data-action="prev-month" aria-label="Предыдущий месяц">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        <span class="monthswitch__label" id="monthLabel" aria-live="polite">Октябрь 2026</span>
        <button class="icon-btn icon-btn--sm" type="button" data-action="next-month" aria-label="Следующий месяц">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
          </svg>
        </button>
      </div>

      <label class="checkbox">
        <input type="checkbox" id="showPast" aria-label="Показать прошедшие">
        <span class="checkbox__full" aria-hidden="true">Показать прошедшие</span>
        <span class="checkbox__short" aria-hidden="true">Прошедшие</span>
      </label>

      <p class="toolbar__meta" id="calendarMeta"></p>
    </div>

    <div class="section__head">
      <h2 class="section__title" id="upcomingTitle">Предстоящие</h2>
      <span class="section__count" id="upcomingCount"></span>
    </div>

    <div class="grid" id="upcomingGrid"></div>

    <div class="empty" id="calendarEmpty" hidden>
      <p class="empty__title" id="calendarEmptyTitle"></p>
      <p class="empty__text" id="calendarEmptyText"></p>
    </div>

    <section class="section" id="pastSection" hidden aria-labelledby="pastTitle">
      <div class="section__head">
        <h2 class="section__title" id="pastTitle">Прошедшие</h2>
        <span class="section__count" id="pastCount"></span>
      </div>
      <div class="grid" id="pastGrid"></div>
    </section>

    <div class="grid skeleton-grid" id="skeletonGrid" hidden aria-hidden="true"></div>
  </section>

  <section class="view page" id="view-watchlist" hidden aria-labelledby="watchTitle">
    <div class="watch-head">
      <h1 class="page__title" id="watchTitle">Мои сторожки</h1>
      <span class="watch-head__count" id="watchCount"></span>
    </div>
    <p class="page__lead">
      Сервис следит за датой отсечки выбранных тикеров. Когда до закрытия реестра
      останется меньше недели, карточка подсветится.
    </p>

    <div class="search">
      <span class="search__icon" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" focusable="false">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
        </svg>
      </span>
      <input class="search__input" id="tickerSearch" type="text" placeholder="Найти тикер"
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchResults"
             aria-autocomplete="list" aria-label="Поиск тикера">
      <button class="icon-btn icon-btn--sm search__clear" id="searchClear" type="button"
              data-action="clear-search" aria-label="Очистить поиск" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
      <div class="search__results" id="searchResults" role="listbox" aria-label="Совпадения" hidden></div>
    </div>

    <div class="filters" role="group" aria-label="Фильтр сторожков">
      <button class="filter is-active" type="button" data-action="set-filter" data-filter="all">Все</button>
      <button class="filter" type="button" data-action="set-filter" data-filter="near">В пределах порога</button>
      <button class="filter" type="button" data-action="set-filter" data-filter="critical">Критичные</button>
    </div>

    <ul class="watch-list" id="watchList"></ul>

    <div class="empty" id="watchEmpty" hidden>
      <p class="empty__title" id="watchEmptyTitle"></p>
      <p class="empty__text" id="watchEmptyText"></p>
      <button class="btn btn--ghost" type="button" data-action="go-calendar" id="watchEmptyCta">
        Перейти в календарь
      </button>
    </div>
  </section>
</main>

<nav class="bottom-nav" aria-label="Основная навигация">
  <a class="bottom-nav__item" href="#/calendar" data-nav="calendar">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
    </svg>
    <span>Календарь</span>
  </a>
  <a class="bottom-nav__item" href="#/me" data-nav="watchlist">
    <span class="bottom-nav__icon-wrap">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
      </svg>
      <span class="badge js-badge" aria-hidden="true">3</span>
    </span>
    <span>Сторожки</span>
  </a>
</nav>

<div id="modalRoot"></div>

<div class="snackbar" id="snackbar" role="status" aria-live="polite">
  <span class="snackbar__text" id="snackbarText"></span>
  <button class="snackbar__action" id="snackbarAction" type="button" hidden></button>
</div>

<noscript>
  <p class="noscript">Для работы прототипа нужен JavaScript.</p>
</noscript>

<script src="app.js" defer></script>
</body>
</html>

# Alembic configuration for the Dividend Calendar backend.
# The database URL is resolved in migrations/env.py from Settings
# (DIVCAL_DATABASE_URL). Keep this file ASCII-only: Alembic reads it
# using the locale encoding on Windows.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
